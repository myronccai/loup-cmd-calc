name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with `loup` in package.lppkg.
      LOUP_VERSION: "1.26.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Loup ${{ env.LOUP_VERSION }}
        run: |
          curl -fsSL "https://github.com/code-craft-ai-company/loup-releases/releases/download/v${LOUP_VERSION}/loup-install.sh" \
            | sh -s -- --version "${LOUP_VERSION}" --no-modify-path -y
          echo "$HOME/.loup/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          loup --version
          clang --version

      # Lint, check, unit tests, native build, end-to-end tests, and parity
      # of the interpreted, native and Wasm lanes.
      - name: Check, test, build and compare lanes
        run: make ci

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: calc-linux-x86_64
          path: build/calc
          if-no-files-found: error

      - name: Upload Wasm desktop package
        uses: actions/upload-artifact@v4
        with:
          name: calc-wasm-desktop-linux-x86_64
          path: build/pkg
          if-no-files-found: error
